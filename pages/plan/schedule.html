<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>내 여행 일정표</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1"
            rel="stylesheet"
        />
        <link
            href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
            rel="stylesheet"
        />

        <style>
            body {
                font-family: "Pretendard", sans-serif;
                background-color: #f8fafc;
            }

            /* 스크롤바 */
            .custom-scrollbar::-webkit-scrollbar {
                width: 4px;
            }
            .custom-scrollbar::-webkit-scrollbar-track {
                background: transparent;
            }
            .custom-scrollbar::-webkit-scrollbar-thumb {
                background: #cbd5e1;
                border-radius: 10px;
            }

            /* 핀 디자인 */
            .map-pin {
                position: absolute;
                width: 36px;
                height: 36px;
                margin-left: -18px;
                margin-top: -18px;
                border-radius: 50% 50% 50% 0;
                transform: rotate(-45deg);
                border: 3px solid white;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 20;
                transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                opacity: 0;
                scale: 0.5;
            }
            .map-pin.visible {
                opacity: 1;
                scale: 1;
            }
            .map-pin span {
                transform: rotate(45deg);
                color: white;
                font-weight: 800;
                font-size: 14px;
            }

            /* 맵 경로 (SVG) */
            .route-path {
                opacity: 0;
                transition: opacity 0.4s ease;
            }
            .route-path.visible {
                opacity: 1;
            }

            /* 아코디언 애니메이션 */
            .accordion-content {
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s ease-out;
            }
            .accordion-item.active .accordion-content {
                max-height: 1000px;
                transition: max-height 0.5s ease-in;
            }
            .accordion-item.active .arrow-icon {
                transform: rotate(180deg);
            }

            /* 모달 애니메이션 */
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>
    </head>
    <body class="h-screen overflow-hidden flex flex-col">
        <main class="flex-1 flex overflow-hidden">
            <aside
                class="w-[420px] bg-white border-r border-slate-200 flex flex-col shadow-xl z-20"
            >
                <div class="p-8 pb-4">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span
                                class="inline-block px-3 py-1 bg-blue-50 text-blue-600 rounded-full text-[11px] font-bold mb-2"
                                >Upcoming</span
                            >
                            <h1
                                class="text-2xl font-extrabold text-slate-900 tracking-tight"
                                id="trip-title"
                            >
                                여행 계획 로딩 중...
                            </h1>
                            <p
                                class="text-sm text-slate-500 font-medium mt-1"
                                id="trip-dates"
                            >
                                -
                            </p>
                        </div>
                    </div>

                    <div class="flex p-1 bg-slate-100 rounded-xl">
                        <button
                            onclick="switchTab('schedule')"
                            id="tab-schedule"
                            class="flex-1 py-2.5 rounded-lg text-sm font-bold bg-white text-slate-800 shadow-sm transition-all"
                        >
                            상세 일정
                        </button>
                        <button
                            onclick="switchTab('cost')"
                            id="tab-cost"
                            class="flex-1 py-2.5 rounded-lg text-sm font-semibold text-slate-500 hover:text-slate-700 transition-all"
                        >
                            항공권 정보
                        </button>
                    </div>
                </div>

                <div
                    id="content-schedule"
                    class="flex-1 overflow-y-auto custom-scrollbar px-6 pb-8 space-y-4"
                ></div>

                <div
                    id="content-cost"
                    class="hidden flex-1 overflow-y-auto custom-scrollbar px-6 pb-8 space-y-4"
                ></div>
            </aside>

            <section class="flex-1 relative bg-slate-100 overflow-hidden">
                <div
                    class="absolute inset-0 bg-cover bg-center opacity-80"
                    style="
                        background-image: url(&quot;https://assets.website-files.com/63c5e2d6778f8c4c37976150/63c5e2d6778f8c14a5976214_map-placeholder.png&quot;);
                        filter: grayscale(20%);
                    "
                ></div>

                <svg
                    class="absolute inset-0 w-full h-full pointer-events-none z-10"
                ></svg>
                <div
                    class="absolute inset-0 z-20 pointer-events-none"
                    id="pins-container"
                ></div>

                <div
                    id="map-legend"
                    class="absolute bottom-8 right-8 bg-white/90 backdrop-blur-md px-5 py-3 rounded-2xl shadow-lg border border-white/50 z-30 hidden transition-opacity"
                ></div>
            </section>
        </main>

        <div
            id="detail-modal"
            class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4"
        >
            <div
                class="bg-white w-full max-w-2xl h-[95vh] rounded-3xl shadow-2xl flex flex-col relative overflow-hidden border border-slate-200 animate-[fadeIn_0.2s_ease-out]"
            >
                <button
                    onclick="closeDetail()"
                    class="absolute top-6 right-6 z-20 w-10 h-10 bg-black/30 hover:bg-black/50 text-white rounded-full flex items-center justify-center backdrop-blur-md transition-all shadow-lg cursor-pointer"
                >
                    <span class="material-symbols-outlined text-[24px]"
                        >close</span
                    >
                </button>

                <div
                    id="detail-content"
                    class="flex-1 overflow-y-auto custom-scrollbar bg-white pb-10"
                ></div>
            </div>
        </div>

        <script>
            // 1. 상세 보기용 더미 데이터
            const BASE_PLACE_DETAILS = {
                phone: "+82-2-1234-5678",
                hours: "09:00 - 18:00",
                rating: 4.5,
                reviewCount: 234,
                tags: ["인기", "사진 명소", "가족 여행", "데이트"],
                reviews: [
                    {
                        id: "1",
                        author: "여행러버",
                        rating: 5,
                        date: "2026-01-15",
                        content:
                            "정말 멋진 곳이었어요! 사진 찍기에도 좋고 주변에 맛집도 많아요. 강력 추천합니다!",
                    },
                    {
                        id: "2",
                        author: "세계여행가",
                        rating: 4,
                        date: "2026-01-10",
                        content:
                            "기대했던 것보다 좋았습니다. 다만 사람이 많아서 조금 붐볐어요.",
                    },
                    {
                        id: "3",
                        author: "가족여행",
                        rating: 5,
                        date: "2026-01-05",
                        content:
                            "아이들과 함께 가기 정말 좋은 곳이에요. 시설도 깨끗하고 직원분들도 친절하셨습니다.",
                    },
                ],
                facilities: [
                    "주차 가능",
                    "와이파이",
                    "휠체어 접근",
                    "반려동물 동반 가능",
                ],
            };

            const FIXED_COORDS = {
                에펠탑: { top: "20%", left: "10%" },
                "도쿄 타워": { top: "40%", left: "90%" },
                "스위스 알프스": { top: "15%", left: "45%" },
                산토리니: { top: "45%", left: "55%" },
                "사그라다 파밀리아": { top: "40%", left: "20%" },
                "몰디브 해변": { top: "85%", left: "70%" },
                "로마 콜로세움": { top: "35%", left: "50%" },
                두바이: { top: "55%", left: "65%" },
                "현지 맛집": { top: "65%", left: "30%" },
                박물관: { top: "25%", left: "75%" },
                "기념품 가게": { top: "75%", left: "60%" },
                카페: { top: "50%", left: "50%" },
                공원: { top: "35%", left: "25%" },
            };

            function getPlaceCoordinates(name, location) {
                const cleanName = name ? name.trim() : "";
                const cleanLoc = location ? location.trim() : "";
                if (FIXED_COORDS[cleanName]) return FIXED_COORDS[cleanName];
                const seedString = cleanLoc || cleanName || "default";
                let hash = 0;
                for (let i = 0; i < seedString.length; i++) {
                    const char = seedString.charCodeAt(i);
                    hash = (hash << 5) - hash + char;
                    hash = hash & hash;
                }
                hash = Math.abs(hash);
                const left = 10 + (hash % 81);
                const top = 15 + ((hash * 7) % 76);
                return { top: `${top}%`, left: `${left}%` };
            }

            function getDayColor(index) {
                const hue = (index * 137.5) % 360;
                return `hsl(${hue}, 70%, 50%)`;
            }

            let currentPlan = null;

            function init() {
                const urlParams = new URLSearchParams(window.location.search);
                const planId = urlParams.get("id");
                console.log("Received planId in schedule.html:", planId);

                // ★★★ [중요] 첫 번째 코드의 로그인 체크 로직 적용 ★★★
                const loggedInUser = JSON.parse(
                    localStorage.getItem("loggedInUser"),
                );

                if (!loggedInUser || !loggedInUser.email) {
                    document.body.innerHTML = `<div class="flex items-center justify-center h-full text-slate-500">로그인이 필요합니다.</div>`;
                    return;
                }

                // 사용자별 키 사용
                const userPlansKey = `tripPlans_${loggedInUser.email}`;
                const savedPlans = JSON.parse(
                    localStorage.getItem(userPlansKey) || "[]",
                );
                currentPlan = savedPlans.find((p) => p.id === planId);

                // 임시 저장소(draft)도 사용자별로 체크
                if (!currentPlan) {
                    const draftKey = `tripPlanner_draft_${loggedInUser.email}`;
                    const draft = localStorage.getItem(draftKey);
                    if (draft) {
                        const parsed = JSON.parse(draft);
                        if (parsed.currentPlanId === planId) {
                            currentPlan = parsed;
                            if (!currentPlan.name)
                                currentPlan.name = currentPlan.tripName;
                        }
                    }
                }

                if (!currentPlan) {
                    document.body.innerHTML = `<div class="flex items-center justify-center h-full text-slate-500">일정을 찾을 수 없습니다.</div>`;
                    return;
                }

                if (currentPlan.schedule) {
                    currentPlan.schedule.forEach((day) => {
                        day.items.sort((a, b) =>
                            a.startTime.localeCompare(b.startTime),
                        );
                    });
                }

                renderBasicInfo();
                renderItinerary();
                renderMap();
                renderFlightInfo();
            }

            function renderBasicInfo() {
                document.getElementById("trip-title").textContent =
                    currentPlan.name || currentPlan.tripName;

                if (currentPlan.startDate && currentPlan.endDate) {
                    const startDate = new Date(currentPlan.startDate);
                    const endDate = new Date(currentPlan.endDate);
                    const timeDiff = endDate.getTime() - startDate.getTime();
                    const dayDiff = timeDiff / (1000 * 3600 * 24);
                    const nights = Math.max(0, Math.round(dayDiff));
                    const days = nights + 1;
                    const dateText = `${currentPlan.startDate} - ${currentPlan.endDate} · ${nights}박 ${days}일`;
                    document.getElementById("trip-dates").textContent =
                        dateText;
                } else {
                    const count = currentPlan.schedule
                        ? currentPlan.schedule.length
                        : 0;
                    document.getElementById("trip-dates").textContent =
                        `총 ${count}일간의 여행`;
                }
            }

            function renderItinerary() {
                const container = document.getElementById("content-schedule");
                container.innerHTML = "";

                if (
                    !currentPlan.schedule ||
                    currentPlan.schedule.length === 0
                ) {
                    container.innerHTML = `<p class="text-center text-gray-400 py-10">일정이 없습니다.</p>`;
                    return;
                }

                currentPlan.schedule.forEach((day, idx) => {
                    const dayNum = idx + 1;
                    const color = getDayColor(idx);
                    const lightBg = `hsl(${(idx * 137.5) % 360}, 70%, 96%)`;
                    const dateStr = day.date || `Day ${dayNum}`;

                    const dayHtml = `
                    <div class="accordion-item ${idx === 0 ? "active" : ""} bg-white border border-slate-100 rounded-[24px] overflow-hidden shadow-sm mb-4" data-day="${dayNum}">
                        <button class="w-full flex items-center justify-between p-5 hover:bg-slate-50 transition-colors" onclick="toggleDay(${dayNum})">
                            <div class="flex items-center gap-4">
                                <span class="w-10 h-10 rounded-full text-white flex items-center justify-center text-sm font-bold shadow-lg" style="background-color: ${color}">${dayNum}</span>
                                <div class="text-left">
                                    <h3 class="text-[15px] font-bold text-slate-800">${dayNum}일차</h3>
                                    <p class="text-[11px] text-slate-400">${dateStr}</p>
                                </div>
                            </div>
                            <span class="material-symbols-outlined text-slate-400 arrow-icon transition-transform">expand_more</span>
                        </button>
                        
                        <div class="accordion-content" style="background-color: ${lightBg}">
                            <div class="p-4 space-y-3 relative">
                                <div class="absolute left-[29px] top-6 bottom-6 w-0.5 border-l-2 border-dotted border-slate-300 z-0"></div>
                                ${day.items
                                    .map(
                                        (item, i) => `
                                    <div class="relative z-10 pl-10">
                                        <div onclick="openPlaceDetail(${idx}, ${i})" 
                                             class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex gap-3 cursor-pointer hover:border-slate-300 hover:shadow-md transition-all group">
                                            
                                            <div class="flex flex-col items-center gap-1 min-w-[50px]">
                                                <div class="p-2 rounded-xl transition-colors group-hover:bg-slate-100" style="background-color: ${color}20; color: ${color}">
                                                    <span class="material-symbols-outlined text-[20px]">${item.place.category === "custom" ? "edit_location" : "location_on"}</span>
                                                </div>
                                                <span class="text-[11px] font-bold text-slate-400">${item.startTime}</span>
                                            </div>
                                            <div class="flex-1 min-w-0 py-0.5">
                                                <h4 class="text-[14px] font-bold text-slate-800 truncate leading-tight group-hover:text-blue-600 transition-colors">${item.place.name}</h4>
                                                <div class="flex items-center gap-1 mt-1">
                                                    <span class="material-symbols-outlined text-[12px] text-slate-400">public</span>
                                                    <p class="text-[12px] text-slate-500 truncate font-medium">${item.place.country || "위치 정보 없음"}</p>
                                                </div>
                                                ${
                                                    item.memo
                                                        ? `
                                                    <div class="mt-2 text-[11px] bg-slate-50 p-2 rounded-lg text-slate-600 border border-slate-100 flex items-start gap-1.5">
                                                        <span class="material-symbols-outlined text-[14px] text-slate-400 mt-[1px]">description</span>
                                                        <span class="break-words leading-relaxed line-clamp-2">${item.memo}</span>
                                                    </div>
                                                `
                                                        : ""
                                                }
                                            </div>
                                            <div class="flex items-center text-slate-300">
                                                <span class="material-symbols-outlined text-[18px]">chevron_right</span>
                                            </div>
                                        </div>
                                    </div>
                                `,
                                    )
                                    .join("")}
                            </div>
                        </div>
                    </div>
                `;
                    container.insertAdjacentHTML("beforeend", dayHtml);
                });

                const shareButtonHtml = `
                <button onclick="alert('친구에게 공유할 링크가 복사되었습니다! (시뮬레이션)')" class="w-full py-4 mt-4 bg-slate-900 text-white rounded-[20px] font-bold flex items-center justify-center gap-2 hover:bg-slate-800 transition-all shadow-lg shadow-slate-200">
                    <span class="material-symbols-outlined text-[20px]">share</span>
                    커뮤니티에 공유하기
                </button>
            `;
                container.insertAdjacentHTML("beforeend", shareButtonHtml);
            }

            function renderMap() {
                const pinsContainer = document.getElementById("pins-container");
                const svgContainer = document.querySelector("svg");
                const legendContainer = document.getElementById("map-legend");

                pinsContainer.innerHTML = "";
                svgContainer.innerHTML = "";
                legendContainer.innerHTML = "";

                svgContainer.setAttribute("viewBox", "0 0 100 100");
                svgContainer.setAttribute("preserveAspectRatio", "none");

                if (!currentPlan.schedule) return;

                const legendP = document.createElement("p");
                legendP.className =
                    "text-[12px] font-bold text-slate-600 flex items-center";
                legendContainer.classList.remove("hidden");

                currentPlan.schedule.forEach((day, dayIdx) => {
                    const dayNum = dayIdx + 1;
                    const color = getDayColor(dayIdx);
                    const legendSpan = document.createElement("span");
                    const marginClass = dayIdx === 0 ? "mr-1" : "ml-3 mr-1";
                    legendSpan.innerHTML = `<span class="inline-block w-2 h-2 rounded-full ${marginClass}" style="background-color: ${color}"></span>${dayNum}일차`;
                    legendP.appendChild(legendSpan);

                    const pinsGroup = document.createElement("div");
                    pinsGroup.id = `pins-day${dayNum}`;
                    pinsGroup.className = `transition-opacity duration-300 ${dayIdx === 0 ? "" : "opacity-0"}`;
                    pinsContainer.appendChild(pinsGroup);

                    let pathData = "";
                    day.items.forEach((item, itemIdx) => {
                        const coords = getPlaceCoordinates(
                            item.place.name,
                            item.place.country,
                        );
                        const pin = document.createElement("div");
                        pin.className = `map-pin ${dayIdx === 0 ? "visible" : ""}`;
                        pin.style.top = coords.top;
                        pin.style.left = coords.left;
                        pin.style.backgroundColor = color;
                        pin.style.borderColor = color;
                        pin.innerHTML = `<span>${itemIdx + 1}</span>`;
                        pinsGroup.appendChild(pin);

                        const x = parseFloat(coords.left);
                        const y = parseFloat(coords.top);
                        pathData +=
                            itemIdx === 0 ? `M ${x} ${y}` : ` L ${x} ${y}`;
                    });

                    if (day.items.length >= 2) {
                        const path = document.createElementNS(
                            "http://www.w3.org/2000/svg",
                            "path",
                        );
                        path.setAttribute("id", `route-day${dayNum}`);
                        path.setAttribute(
                            "class",
                            `route-path ${dayIdx === 0 ? "visible" : ""}`,
                        );
                        path.setAttribute("d", pathData);
                        path.setAttribute("fill", "none");
                        path.setAttribute("stroke", color);
                        path.setAttribute("stroke-width", "1.5");
                        path.style.vectorEffect = "non-scaling-stroke";
                        path.setAttribute("stroke-dasharray", "4 4");
                        path.setAttribute("stroke-linecap", "round");
                        path.setAttribute("stroke-linejoin", "round");
                        svgContainer.appendChild(path);
                    }
                });
                legendContainer.appendChild(legendP);
            }

            function renderFlightInfo() {
                const container = document.getElementById("content-cost");
                const info = currentPlan.flightInfo;

                if (!info) {
                    container.innerHTML = `
                    <div class="p-10 text-center text-slate-400 flex flex-col items-center mt-10">
                        <div class="bg-slate-100 p-4 rounded-full mb-4">
                            <span class="material-symbols-outlined text-3xl text-slate-300">flight_off</span>
                        </div>
                        <p class="font-bold text-slate-600 mb-1">항공권 정보가 없습니다</p>
                        <p class="text-xs">여행 계획 단계에서 항공권을 선택해주세요.</p>
                    </div>`;
                    return;
                }

                const fmtPrice = (n) =>
                    new Intl.NumberFormat("ko-KR").format(n);
                const renderCard = (type, flightData) => {
                    if (!flightData) return "";
                    const isOut = type === "가는 편";
                    const themeColor = isOut
                        ? "text-blue-600"
                        : "text-indigo-600";
                    const badgeBg = isOut ? "bg-blue-600" : "bg-indigo-600";
                    const softBg = isOut ? "bg-blue-50" : "bg-indigo-50";

                    const getBoldColorClass = (originalColorStr) => {
                        if (!originalColorStr) return "bg-slate-700 text-white";
                        if (originalColorStr.includes("sky"))
                            return "bg-sky-300 text-white shadow-sm shadow-sky-200";
                        if (originalColorStr.includes("red"))
                            return "bg-red-300 text-white shadow-sm shadow-red-200";
                        if (originalColorStr.includes("orange"))
                            return "bg-orange-300 text-white shadow-sm shadow-orange-200";
                        if (originalColorStr.includes("green"))
                            return "bg-green-300 text-white shadow-sm shadow-green-200";
                        return "bg-slate-700 text-white";
                    };
                    const airlineLogoClass = getBoldColorClass(
                        flightData.airline.color,
                    );

                    return `
                    <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm relative overflow-hidden group hover:border-slate-300 transition-all">
                        <div class="absolute -right-6 -top-6 w-24 h-24 ${softBg} rounded-full opacity-50 group-hover:scale-110 transition-transform"></div>
                        <div class="flex justify-between items-start mb-6 relative z-10">
                            <div class="flex items-center gap-2">
                                <span class="px-2 py-1 ${badgeBg} text-white text-[10px] font-bold rounded uppercase tracking-wider">${type}</span>
                                <span class="text-xs text-slate-500 font-bold">${flightData.date || (isOut ? info.startDate : info.endDate)}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-sm font-bold text-slate-700">${flightData.airline.name}</span>
                                <div class="w-7 h-7 rounded-full ${airlineLogoClass} flex items-center justify-center text-[10px] font-bold tracking-tighter">
                                    ${flightData.airline.code}
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center justify-between relative z-10 mb-5 px-2">
                            <div class="text-center w-20">
                                <div class="text-2xl font-black text-slate-800 tracking-tight">${flightData.depTime}</div>
                                <div class="text-xs font-bold text-slate-400 mt-1 bg-slate-100 px-2 py-0.5 rounded-md inline-block">${flightData.depCode}</div>
                            </div>
                            <div class="flex-1 px-2 flex flex-col items-center justify-center w-full">
                                <div class="text-[11px] text-slate-500 font-bold mb-2">${flightData.duration || "00시간 00분"}</div>
                                <div class="w-full relative flex items-center justify-center">
                                    <div class="absolute inset-x-0 h-[2px] bg-slate-200"></div>
                                    <span class="material-symbols-outlined text-slate-400 text-lg rotate-90 bg-white px-1 relative z-10">flight</span>
                                </div>
                                <div class="text-[10px] ${themeColor} font-bold mt-2">직항</div>
                            </div>
                            <div class="text-center w-20">
                                <div class="text-2xl font-black text-slate-800 tracking-tight">${flightData.arrTime}</div>
                                <div class="text-xs font-bold text-slate-400 mt-1 bg-slate-100 px-2 py-0.5 rounded-md inline-block">${flightData.arrCode}</div>
                            </div>
                        </div>
                        <div class="border-t border-dashed border-slate-200 pt-3 flex justify-between items-center relative z-10">
                            <span class="text-xs text-slate-500 font-medium">1인 항공운임</span>
                            <span class="text-sm font-bold text-slate-800">${fmtPrice(flightData.price)}원</span>
                        </div>
                    </div>
                `;
                };

                container.innerHTML = `
                <div class="space-y-4" style="animation: fadeIn 0.5s ease-out">
                    ${renderCard("가는 편", info.outbound)}
                    ${renderCard("오는 편", info.inbound)}
                    <div class="bg-slate-900 text-white p-6 rounded-2xl shadow-lg mt-6 relative overflow-hidden">
                        <div class="absolute right-0 top-0 w-32 h-32 bg-white/5 rounded-full blur-2xl pointer-events-none"></div>
                        <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-4">
                            <span class="text-sm text-slate-300 font-medium">탑승객</span>
                            <span class="font-bold">성인 ${info.passengers}명</span>
                        </div>
                        <div class="flex justify-between items-end relative z-10">
                            <div class="flex flex-col">
                                <span class="text-xs text-slate-400 mb-1">총 결제 금액 (세금포함)</span>
                                <div class="text-3xl font-extrabold tracking-tight">${fmtPrice(info.totalPrice)}원</div>
                            </div>
                        </div>
                    </div>
                    <div class="text-center mt-4 pb-4">
                        <p class="text-[11px] text-slate-400 leading-relaxed">* 상기 시간은 현지 시간 기준입니다.<br>* 항공사 사정에 의해 예고 없이 변경될 수 있습니다.</p>
                    </div>
                </div>
            `;
            }

            function switchTab(tabName) {
                const isSchedule = tabName === "schedule";
                const sBtn = document.getElementById("tab-schedule");
                const cBtn = document.getElementById("tab-cost");
                sBtn.className = isSchedule
                    ? "flex-1 py-2.5 rounded-lg text-sm font-bold bg-white text-slate-800 shadow-sm transition-all"
                    : "flex-1 py-2.5 rounded-lg text-sm font-semibold text-slate-500 hover:text-slate-700 transition-all";
                cBtn.className = !isSchedule
                    ? "flex-1 py-2.5 rounded-lg text-sm font-bold bg-white text-slate-800 shadow-sm transition-all"
                    : "flex-1 py-2.5 rounded-lg text-sm font-semibold text-slate-500 hover:text-slate-700 transition-all";
                document
                    .getElementById("content-schedule")
                    .classList.toggle("hidden", !isSchedule);
                document
                    .getElementById("content-cost")
                    .classList.toggle("hidden", isSchedule);
            }

            function toggleDay(day) {
                const item = document.querySelector(
                    `.accordion-item[data-day="${day}"]`,
                );
                const isActive = item.classList.toggle("active");
                const route = document.getElementById(`route-day${day}`);
                const pinsGroup = document.getElementById(`pins-day${day}`);
                if (isActive) {
                    if (route) route.classList.add("visible");
                    if (pinsGroup) {
                        pinsGroup.classList.remove("opacity-0");
                        pinsGroup
                            .querySelectorAll(".map-pin")
                            .forEach((pin) => pin.classList.add("visible"));
                    }
                } else {
                    if (route) route.classList.remove("visible");
                    if (pinsGroup) {
                        pinsGroup.classList.add("opacity-0");
                        pinsGroup
                            .querySelectorAll(".map-pin")
                            .forEach((pin) => pin.classList.remove("visible"));
                    }
                }
            }

            // ★★★ 상세 보기 모달 관련 함수 ★★★
            function openPlaceDetail(dayIdx, itemIdx) {
                const item = currentPlan.schedule[dayIdx].items[itemIdx];
                const place = item.place;
                const modal = document.getElementById("detail-modal");
                const content = document.getElementById("detail-content");

                if (place.category === "custom") {
                    content.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center p-8 text-center bg-white">
                        <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mb-4 text-slate-300">
                            <span class="material-symbols-outlined text-4xl">edit_off</span>
                        </div>
                        <h3 class="text-xl font-bold text-slate-800 mb-2">상세 정보 없음</h3>
                        <p class="text-sm text-slate-500 leading-relaxed">
                            사용자가 직접 추가한 일정입니다.
                        </p>
                    </div>
                `;
                } else {
                    const details = {
                        ...BASE_PLACE_DETAILS,
                        name: place.name,
                        image:
                            place.image ||
                            "https://assets.website-files.com/63c5e2d6778f8c4c37976150/63c5e2d6778f8c14a5976214_map-placeholder.png",
                        address: `123 Travel Street, ${place.country}`,
                        description: place.description || "",
                    };

                    content.innerHTML = `
                    <div class="relative h-64 bg-slate-200">
                        <img src="${details.image}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent"></div>
                        <div class="absolute bottom-6 left-6 right-6 text-white">
                            <h2 class="text-3xl font-bold leading-tight shadow-black drop-shadow-md">${details.name}</h2>
                            <p class="text-sm opacity-90 mt-1 flex items-center gap-1">
                                <span class="material-symbols-outlined text-sm">location_on</span> ${place.country}
                            </p>
                        </div>
                    </div>

                    <div class="p-8 space-y-8 bg-white">
                        <div class="space-y-4 text-sm text-gray-600 border-b border-gray-100 pb-8">
                            <div class="flex items-center gap-3">
                                <span class="material-symbols-outlined text-indigo-600">location_on</span>
                                <span>${details.address}</span>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="material-symbols-outlined text-indigo-600">call</span>
                                <span>${details.phone}</span>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="material-symbols-outlined text-indigo-600">schedule</span>
                                <span>${details.hours}</span>
                            </div>
                            <div class="flex items-center gap-2 mt-2">
                                <span class="flex text-orange-400">
                                    <span class="material-symbols-outlined text-sm fill-current">star</span>
                                </span>
                                <span class="font-bold text-gray-800">${details.rating}</span>
                                <span class="text-gray-400">(${details.reviewCount} reviews)</span>
                            </div>
                        </div>

                        <div class="flex flex-wrap gap-2">
                            ${details.tags.map((tag) => `<span class="px-3 py-1 bg-gray-100 text-gray-600 text-xs rounded-full font-medium">#${tag}</span>`).join("")}
                        </div>

                        <div>
                            <h3 class="font-bold text-gray-800 mb-3 text-sm uppercase flex items-center gap-2">
                                <span class="w-1 h-4 bg-indigo-500 rounded-full"></span> 편의 시설
                            </h3>
                            <ul class="grid grid-cols-2 gap-y-2">
                                ${details.facilities.map((f) => `<li class="flex items-center gap-2 text-sm text-gray-600"><span class="w-1.5 h-1.5 bg-indigo-300 rounded-full"></span>${f}</li>`).join("")}
                            </ul>
                        </div>

                        <div>
                            <h3 class="font-bold text-gray-800 mb-4 text-sm uppercase flex items-center gap-2">
                                <span class="w-1 h-4 bg-orange-400 rounded-full"></span> 최근 리뷰
                            </h3>
                            <div class="space-y-3">
                                ${details.reviews
                                    .map(
                                        (review) => `
                                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                                        <div class="flex justify-between items-start mb-1">
                                            <span class="font-bold text-sm text-gray-900">${review.author}</span>
                                            <span class="text-xs text-gray-400">${review.date}</span>
                                        </div>
                                        <div class="flex text-orange-400 gap-0.5 mb-2 scale-75 origin-left">
                                            ${Array(review.rating).fill('<span class="material-symbols-outlined text-xs fill-current">star</span>').join("")}
                                        </div>
                                        <p class="text-sm text-gray-600 leading-relaxed">${review.content}</p>
                                    </div>
                                `,
                                    )
                                    .join("")}
                            </div>
                        </div>
                    </div>
                `;
                }

                modal.classList.remove("hidden");
                content.scrollTop = 0;
            }

            function closeDetail() {
                document.getElementById("detail-modal").classList.add("hidden");
            }

            init();
        </script>
    </body>
</html>
