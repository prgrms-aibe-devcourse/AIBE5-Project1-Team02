            // ==========================================

            const Store = {
                state: {
                    tripName: "나의 멋진 여행", // 기본 제목 변경
                    startDate: "",
                    endDate: "",
                    departure: "",
                    destination: "",
                    schedule: [],
                    selectedDay: 0,
                    savedPlans: [],
                    currentPlanId: null,
                    showPlanList: false,
                    isCollapsed: false,
                    selectedPlace: null,
                    showAddModal: false,
                },

                init() {
                    // 1. 기존 저장된 계획 목록 불러오기
                    const plans = localStorage.getItem("tripPlans");
                    if (plans) {
                        this.state.savedPlans = JSON.parse(plans);
                    }

                    // 2. ★ [수정됨] Flight.html에서 넘어온 데이터가 있는지 확인
                    const flightInfo = localStorage.getItem(
                        "tripPlanner_flightInfo",
                    );

                    if (flightInfo) {
                        const fData = JSON.parse(flightInfo);

                        // 항공권 정보로 상태 덮어쓰기
                        this.state.startDate = fData.startDate;
                        this.state.endDate = fData.endDate;
                        this.state.departure = fData.departure;
                        this.state.destination = fData.destination;

                        // (선택사항) 항공편 정보를 첫날과 마지막날 일정에 자동으로 추가하고 싶다면 여기서 처리 가능
                        // 일단은 날짜와 장소만 동기화합니다.
                    }
                    // 3. 작업 중이던 임시 데이터(Draft) 확인 (항공권 정보가 없을 때만)
                    else {
                        const draft = localStorage.getItem("tripPlanner_draft");
                        if (draft) {
                            const parsedDraft = JSON.parse(draft);
                            this.state = { ...this.state, ...parsedDraft };
                        }
                    }

                    // 날짜에 맞춰 스케줄 배열 초기화
                    this.updateScheduleDates();
                },

                setState(newState) {
                    this.state = { ...this.state, ...newState };

                    // 날짜 변경 시 스케줄 배열 재조정
                    if (newState.startDate || newState.endDate) {
                        this.updateScheduleDates();
                    }

                    // ★ [추가] 상태가 변할 때마다 '현재 작업 내용'을 로컬스토리지에 자동 저장
                    // (목록이나 UI 관련 상태는 제외하고, 실제 데이터만 저장)
                    const draftData = {
                        tripName: this.state.tripName,
                        startDate: this.state.startDate,
                        endDate: this.state.endDate,
                        departure: this.state.departure,
                        destination: this.state.destination,
                        schedule: this.state.schedule,
                        selectedDay: this.state.selectedDay,
                        currentPlanId: this.state.currentPlanId,
                    };
                    localStorage.setItem(
                        "tripPlanner_draft",
                        JSON.stringify(draftData),
                    );

                    App.render();
                },

                updateScheduleDates() {
                    if (this.state.startDate && this.state.endDate) {
                        const start = new Date(this.state.startDate);
                        const end = new Date(this.state.endDate);
                        const days = [];

                        for (
                            let d = new Date(start);
                            d <= end;
                            d.setDate(d.getDate() + 1)
                        ) {
                            const dateStr = d.toISOString().split("T")[0];
                            const existing = this.state.schedule.find(
                                (s) => s.date === dateStr,
                            );
                            days.push(existing || { date: dateStr, items: [] });
                        }
                        this.state.schedule = days;
                        // 날짜가 변경되었으므로 selectedDay가 범위를 벗어나지 않게 조정
                        if (this.state.selectedDay >= days.length) {
                            this.state.selectedDay = 0;
                        }
                    }
                },

                getDays() {
                    return this.state.schedule.length;
                },
            };

                        return `${year}. ${month}. ${day}`;

            // ==========================================
            // 4. APP CONTROLLER (수정됨: 편집 로직 포함)
            // ==========================================
            const App = {
                init() {
                    Store.init(); // 기본적인 상태 로드
                    this.checkIncomingFlightData(); // ★ 항공권 데이터 수신 확인
                    this.render();
                },

                // ★ [추가] 항공권 페이지로 이동 전 상태 전달
                goToFlightSearch() {
                    const {
                        startDate,
                        endDate,
                        departure,
                        destination,
                        savedFlights,
                    } = Store.state;

                    localStorage.setItem(
                        "tripPlanner_draft",
                        JSON.stringify(Store.state),
                    );

                    const flightRequest = {
                        mode: !startDate || !endDate ? "NEW" : "EDIT",
                        origin: departure || "",
                        destination: destination || "",
                        startDate: startDate || "",
                        endDate: endDate || "",
                        // ★ [추가] 기존에 선택된 항공권이 있다면 같이 보냄
                        selectedFlights: savedFlights || null,
                    };

                    sessionStorage.setItem(
                        "planner_request",
                        JSON.stringify(flightRequest),
                    );
                    location.href = "flight.html";
                },

                // ★ [추가] 항공권 페이지에서 돌아왔을 때 데이터 처리
                checkIncomingFlightData() {
                    const flightInfoStr = localStorage.getItem(
                        "tripPlanner_flightInfo",
                    );

                    if (flightInfoStr) {
                        const flightInfo = JSON.parse(flightInfoStr);

                        // 기존 Draft 복구
                        const draftStr =
                            localStorage.getItem("tripPlanner_draft");
                        if (draftStr) {
                            const draft = JSON.parse(draftStr);
                            Store.state = { ...Store.state, ...draft };
                        }

                        if (!Store.state.currentPlanId) {
                            Store.state.currentPlanId = Date.now().toString();
                        }

                        const isLocationChanged =
                            Store.state.departure !== flightInfo.departure ||
                            Store.state.destination !== flightInfo.destination;
                        const isDateChanged =
                            Store.state.startDate !== flightInfo.startDate ||
                            Store.state.endDate !== flightInfo.endDate;

                        const nextState = {
                            startDate: flightInfo.startDate,
                            endDate: flightInfo.endDate,
                            departure: flightInfo.departure,
                            destination: flightInfo.destination,
                            // ★ [추가] 항공권 상세 정보를 State에 저장해둡니다.
                            savedFlights: {
                                outbound: flightInfo.outbound,
                                inbound: flightInfo.inbound,
                            },
                        };

                        // 장소나 날짜가 바뀌면 일정 초기화
                        if (isLocationChanged || isDateChanged) {
                            nextState.schedule = [];
                        }

                        Store.setState(nextState, false);

                        localStorage.removeItem("tripPlanner_flightInfo");
                        localStorage.setItem(
                            "tripPlanner_draft",
                            JSON.stringify(Store.state),
                        );
                    } else {
                        // 취소 시
                        const draftStr =
                            localStorage.getItem("tripPlanner_draft");
                        if (draftStr) {
                            Store.setState(JSON.parse(draftStr), false);
                        }
                    }
                },

                render() {
                    const app = document.getElementById("app");
                    app.innerHTML = `
                    ${MainNavbar.render()}
                    ${Header.render()}
                    <div class="flex-1 flex overflow-hidden">
                        ${TripSetting.render()}
                        ${CenterPanel.render()}
                        ${RightPanel.render()}
                    </div>
                    ${AddScheduleModal.render()}
                `;
                    this.attachEvents();
                },

                attachEvents() {
                    this.handleSearch = (query) => {
                        const term = query.toLowerCase();
                        document
                            .querySelectorAll(".place-item")
                            .forEach((item) => {
                                const text = item.dataset.text.toLowerCase();
                                item.style.display = text.includes(term)
                                    ? "block"
                                    : "none";
                            });
                    };

                    const draggables =
                        document.querySelectorAll(".draggable-source");
                    draggables.forEach((el) => {
                        el.addEventListener("dragstart", (e) => {
                            e.dataTransfer.setData(
                                "text/plain",
                                el.dataset.place,
                            );
                            e.dataTransfer.effectAllowed = "copy";
                            el.classList.add("dragging");
                        });
                        el.addEventListener("dragend", () =>
                            el.classList.remove("dragging"),
                        );
                    });

                    const dropZone = document.querySelector(".drop-zone");
                    if (dropZone) {
                        dropZone.addEventListener("dragover", (e) => {
                            e.preventDefault();
                            dropZone.classList.add("drag-over");
                        });
                        dropZone.addEventListener("dragleave", () =>
                            dropZone.classList.remove("drag-over"),
                        );
                        dropZone.addEventListener("drop", (e) => {
                            e.preventDefault();
                            dropZone.classList.remove("drag-over");
                            const rawData =
                                e.dataTransfer.getData("text/plain");
                            if (!rawData) return;
                            try {
                                const place = JSON.parse(
                                    decodeURIComponent(rawData),
                                );
                                this.addItemToSchedule(place);
                            } catch (err) {
                                console.error(err);
                            }
                        });
                    }
                },

                // '새 일정 추가' 버튼 클릭 시 (초기화 후 오픈)
                openAddModal() {
                    Store.setState({ showAddModal: true, editingItem: null });
                },

                closeAddModal() {
                    Store.setState({ showAddModal: false, editingItem: null });
                },

                // ★ [신규] 수정 모드로 모달 열기
                editManualItem(itemId) {
                    const { schedule, selectedDay } = Store.state;
                    const currentDayItems = schedule[selectedDay].items;
                    const itemToEdit = currentDayItems.find(
                        (item) => item.id === itemId,
                    );

                    if (itemToEdit) {
                        Store.setState({
                            showAddModal: true,
                            editingItem: itemToEdit,
                        });
                    }
                },

                // ★ [수정] 팝업에서 저장 (신규 추가 OR 수정)
                addManualSchedule() {
                    const titleInput = document.getElementById("modal-title");
                    const memoInput = document.getElementById("modal-memo");
                    const startTimeInput =
                        document.getElementById("modal-start-time");
                    const endTimeInput =
                        document.getElementById("modal-end-time");
                    const locationInput =
                        document.getElementById("modal-location");

                    const title = titleInput ? titleInput.value.trim() : "";
                    const startTime = startTimeInput
                        ? startTimeInput.value
                        : "";
                    const endTime = endTimeInput ? endTimeInput.value : "";
                    const memo = memoInput ? memoInput.value.trim() : "";
                    const location = locationInput
                        ? locationInput.value.trim()
                        : "";

                    if (!title || !startTime || !endTime) {
                        alert("일정 제목과 시간은 필수 입력 항목입니다.");
                        return;
                    }

                    const { editingItem } = Store.state;

                    // ★ CASE 1: 수정 (Editing)
                    if (editingItem) {
                        const { schedule, selectedDay } = Store.state;
                        const newSchedule = [...schedule];
                        const items = newSchedule[selectedDay].items;
                        const targetIndex = items.findIndex(
                            (i) => i.id === editingItem.id,
                        );

                        if (targetIndex !== -1) {
                            // 기존 데이터 업데이트
                            items[targetIndex] = {
                                ...items[targetIndex],
                                startTime: startTime,
                                endTime: endTime,
                                memo: memo,
                                place: {
                                    ...items[targetIndex].place,
                                    name: title,
                                    country: location,
                                },
                            };
                            Store.setState({ schedule: newSchedule });
                        }
                    }
                    // ★ CASE 2: 신규 추가 (New)
                    else {
                        const newPlace = {
                            id: "custom-" + Date.now(),
                            name: title,
                            country: location || "",
                            image: "https://placehold.co/400x300?text=No+Image",
                            category: "custom",
                            description: memo,
                        };

                        this.addItemToSchedule(newPlace, {
                            startTime: startTime,
                            endTime: endTime,
                            memo: memo,
                        });
                    }

                    this.closeAddModal();
                },

                addItemToSchedule(place, options = {}) {
                    const { selectedDay, schedule } = Store.state;
                    if (schedule.length <= selectedDay) {
                        Store.updateScheduleDates();
                        if (Store.state.schedule.length === 0) {
                            Store.state.schedule = [
                                {
                                    date: new Date()
                                        .toISOString()
                                        .split("T")[0],
                                    items: [],
                                },
                            ];
                        }
                    }

                    const newItem = {
                        id: Date.now().toString(),
                        place: place,
                        startTime: options.startTime || "10:00",
                        endTime: options.endTime || "12:00",
                        memo: options.memo || "",
                    };

                    const newSchedule = [...Store.state.schedule];
                    newSchedule[Store.state.selectedDay].items.push(newItem);
                    Store.setState({ schedule: newSchedule });
                },

                addNearbyToSchedule(placeJson) {
                    const place = JSON.parse(decodeURIComponent(placeJson));
                    if (
                        confirm(
                            `'${place.name}'을(를) 일정에 추가하시겠습니까?`,
                        )
                    ) {
                        this.addItemToSchedule(place);
                        alert(
                            "추가되었습니다. 뒤로가기를 눌러 일정을 확인하세요.",
                        );
                    }
                },

                showDetail(placeJsonOrObj) {
                    let place;
                    if (typeof placeJsonOrObj === "string") {
                        place = JSON.parse(decodeURIComponent(placeJsonOrObj));
                    } else {
                        place = placeJsonOrObj;
                    }
                    Store.setState({ selectedPlace: place });
                },

                closeDetail() {
                    Store.setState({ selectedPlace: null });
                },

                removeItem(itemId) {
                    if (!confirm("삭제하시겠습니까?")) return;
                    const { schedule, selectedDay } = Store.state;
                    const newSchedule = [...schedule];
                    newSchedule[selectedDay].items = newSchedule[
                        selectedDay
                    ].items.filter((i) => i.id !== itemId);
                    Store.setState({ schedule: newSchedule });
                },

                updateItem(itemId, field, value) {
                    const { schedule, selectedDay } = Store.state;
                    const newSchedule = [...schedule];
                    const item = newSchedule[selectedDay].items.find(
                        (i) => i.id === itemId,
                    );

                    if (item) {
                        item[field] = value;
                        Store.setState({ schedule: newSchedule });
                    }
                },

                savePlan() {
                    const {
                        tripName,
                        schedule,
                        savedPlans,
                        currentPlanId,
                        startDate,
                        endDate,
                        departure,
                        destination,
                    } = Store.state;

                    if (!tripName || schedule.length === 0) {
                        alert("여행 제목과 일정을 입력해주세요.");
                        return;
                    }

                    let newPlans = [...savedPlans];
                    let saveId = currentPlanId;

                    // currentPlanId가 있으면 (Requirement 2에 의해 생성되었거나, 이미 로드된 계획)
                    if (saveId) {
                        const idx = newPlans.findIndex((p) => p.id === saveId);
                        if (idx !== -1) {
                            // 기존 계획 업데이트 (덮어쓰기)
                            newPlans[idx] = {
                                ...newPlans[idx],
                                name: tripName,
                                schedule,
                                startDate,
                                endDate,
                                departure,
                                destination,
                                updatedAt: new Date().toISOString(),
                            };
                        } else {
                            // ID는 있는데 리스트에 없다면 (예: 신규 생성 후 첫 저장)
                            newPlans.push({
                                id: saveId,
                                name: tripName,
                                startDate,
                                endDate,
                                departure,
                                destination,
                                schedule,
                                createdAt: new Date().toISOString(),
                            });
                        }
                    } else {
                        // 방어 코드: ID가 없는 경우 (이론상 이 로직엔 안 걸려야 함)
                        saveId = Date.now().toString();
                        Store.setState({ currentPlanId: saveId });
                        newPlans.push({
                            id: saveId,
                            name: tripName,
                            startDate,
                            endDate,
                            departure,
                            destination,
                            schedule,
                            createdAt: new Date().toISOString(),
                        });
                    }

                    localStorage.setItem("tripPlans", JSON.stringify(newPlans));
                    Store.setState({ savedPlans: newPlans }); // currentPlanId는 유지
                    alert("저장되었습니다!");
                },

                loadPlan(planId) {
                    const plan = Store.state.savedPlans.find(
                        (p) => p.id === planId,
                    );
                    if (plan) {
                        Store.setState({
                            currentPlanId: plan.id,
                            tripName: plan.name,
                            startDate: plan.startDate,
                            endDate: plan.endDate,
                            departure: plan.departure || "",
                            destination: plan.destination || "",
                            schedule: plan.schedule || [],
                            selectedDay: 0,
                            showPlanList: false,
                        });
                    }
                },

                deletePlan(planId) {
                    if (confirm("정말 이 계획을 삭제하시겠습니까?")) {
                        const newPlans = Store.state.savedPlans.filter(
                            (p) => p.id !== planId,
                        );
                        localStorage.setItem(
                            "tripPlans",
                            JSON.stringify(newPlans),
                        );

                        let nextState = { savedPlans: newPlans };
                        if (Store.state.currentPlanId === planId) {
                            localStorage.removeItem("tripPlanner_draft");
                            nextState = {
                                ...nextState,
                                currentPlanId: null,
                                tripName: "새로운 여행 계획",
                                startDate: "",
                                endDate: "",
                                departure: "",
                                destination: "",
                                schedule: [],
                                selectedDay: 0,
                                selectedPlace: null,
                            };
                        }
                        Store.setState(nextState);
                    }
                },

                newPlan() {
                    const isLoggedIn = localStorage.getItem('isLoggedIn');
                    if (isLoggedIn !== 'true') {
                        alert('새로운 여행 계획을 생성하려면 로그인해야 합니다.');
                        window.location.href = '../auth/SignIn.html';
                        return;
                    }

                    if (confirm("현재 작업을 초기화하시겠습니까?")) {
                        localStorage.removeItem("tripPlanner_draft");
                        Store.setState({
                            currentPlanId: null,
                            tripName: "새로운 여행 계획",
                            startDate: "",
                            endDate: "",
                            departure: "",
                            destination: "",
                            schedule: [],
                            selectedDay: 0,
                            showPlanList: false,
                            selectedPlace: null,
                        });
                    }
                },
            };

            App.init();
        </script>
        <script src="../../js/auth.js"></script>
        <script>
            document.addEventListener("DOMContentLoaded", checkLoginStatus);
        </script>
    </body>
</html>
