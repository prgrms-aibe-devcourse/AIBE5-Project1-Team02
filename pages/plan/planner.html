        <style>
            body {
                background-color: #f3f4f6;
            }
            ::-webkit-scrollbar {
                width: 6px;
            }
            ::-webkit-scrollbar-track {
                background: #f1f1f1;
            }
            ::-webkit-scrollbar-thumb {
                background: #c7c7c7;
                border-radius: 3px;
            }
            .fade-in {
                animation: fadeIn 0.3s ease-in-out;
            }
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .dragging {
                opacity: 0.5;
                border: 2px dashed #4f46e5;
            }
            .drag-over {
                background-color: #e0e7ff;
                border: 2px dashed #4338ca;
            }
            .marker-pulse {
                animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1)
                    infinite;
            }
            @keyframes pulse-ring {
                0% {
                    transform: scale(0.33);
                    opacity: 1;
                }
                80%,
                100% {
                    transform: scale(2);
                    opacity: 0;
                }
            }
        </style>

                init() {
                    const loggedInUser = JSON.parse(
                        localStorage.getItem("loggedInUser"),
                    );
                    if (loggedInUser && loggedInUser.email) {
                        const userPlansKey = `tripPlans_${loggedInUser.email}`;
                        const plans = localStorage.getItem(userPlansKey);
                        if (plans) {
                            this.state.savedPlans = JSON.parse(plans);
                        } else {
                            this.state.savedPlans = [];
                        }
                    } else {
                        this.state.savedPlans = [];
                    }

                    const flightInfo = localStorage.getItem(
                        "tripPlanner_flightInfo",
                    );
                    if (flightInfo) {
                        const fData = JSON.parse(flightInfo);
                        this.state.startDate = fData.startDate;
                        this.state.endDate = fData.endDate;
                        this.state.departure = fData.departure;
                        this.state.destination = fData.destination;
                    } else {
                        const draftKey =
                            loggedInUser && loggedInUser.email
                                ? `tripPlanner_draft_${loggedInUser.email}`
                                : "tripPlanner_draft_guest";
                        const draft = localStorage.getItem(draftKey);
                        if (draft) {
                            const parsedDraft = JSON.parse(draft);
                            this.state = { ...this.state, ...parsedDraft };
                        }
                    }
                    this.updateScheduleDates();
                },

                setState(newState) {
                    this.state = { ...this.state, ...newState };
                    if (newState.startDate || newState.endDate) {
                        this.updateScheduleDates();
                    }
                    const draftData = {
                        tripName: this.state.tripName,
                        startDate: this.state.startDate,
                        endDate: this.state.endDate,
                        departure: this.state.departure,
                        destination: this.state.destination,
                        schedule: this.state.schedule,
                        selectedDay: this.state.selectedDay,
                        currentPlanId: this.state.currentPlanId,
                        savedFlights: this.state.savedFlights, // ★ [수정됨] 항공권 정보도 임시 저장에 포함
                    };
                    const loggedInUser = JSON.parse(
                        localStorage.getItem("loggedInUser"),
                    );
                    const draftKey =
                        loggedInUser && loggedInUser.email
                            ? `tripPlanner_draft_${loggedInUser.email}`
                            : "tripPlanner_draft_guest";
                    localStorage.setItem(draftKey, JSON.stringify(draftData));
                    App.render();
                },

                updateScheduleDates() {
                    if (this.state.startDate && this.state.endDate) {
                        const start = new Date(this.state.startDate);
                        const end = new Date(this.state.endDate);
                        const days = [];
                        for (
                            let d = new Date(start);
                            d <= end;
                            d.setDate(d.getDate() + 1)
                        ) {
                            const dateStr = d.toISOString().split("T")[0];
                            const existing = this.state.schedule.find(
                                (s) => s.date === dateStr,
                            );
                            days.push(existing || { date: dateStr, items: [] });
                        }
                        this.state.schedule = days;
                        if (this.state.selectedDay >= days.length)
                            this.state.selectedDay = 0;
                    }
                },

                getDays() {
                    return this.state.schedule.length;
                },
            };

                                d.setDate(d.getDate() + i);
                                dateLabel = `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
                            }

                            <h2 class="text-xl font-semibold text-gray-800 mb-4">장소 검색</h2>
                            <div class="relative"><div class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-gray-400">${Icons.Search}</div><input type="text" placeholder="장소 검색..." oninput="App.handleSearch(this.value)" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary" /></div>

            const CenterPanel = {

            const RightPanel = {
                render() {
                    return `<div class="w-96 border-l border-gray-200 bg-white flex flex-col h-full z-20 transition-all">${Store.state.selectedPlace ? PlaceDetails.render() : PlaceSearch.render()}</div>`;

            // ==========================================
            // 4. APP CONTROLLER
            // ==========================================
            const App = {
                init() {
                    Store.init();

                    const urlParams = new URLSearchParams(
                        window.location.search,
                    );
                    const planId = urlParams.get("id");

                    if (planId) {
                        // id가 있으면 해당 plan을 로드합니다.
                        this.loadPlan(planId);
                    } else {
                        // id가 없으면 기존 로직(임시저장 또는 항공권 정보)을 따릅니다.
                        this.checkIncomingFlightData();
                    }

                    this.render();
                },

                goToFlightSearch() {
                    const {
                        startDate,
                        endDate,
                        departure,
                        destination,
                        savedFlights,
                    } = Store.state;
                    const loggedInUser = JSON.parse(
                        localStorage.getItem("loggedInUser"),
                    );
                    const draftKey =
                        loggedInUser && loggedInUser.email
                            ? `tripPlanner_draft_${loggedInUser.email}`
                            : "tripPlanner_draft_guest";
                    localStorage.setItem(draftKey, JSON.stringify(Store.state));
                    const flightRequest = {
                        mode: !startDate || !endDate ? "NEW" : "EDIT",
                        origin: departure || "",
                        destination: destination || "",
                        startDate: startDate || "",
                        endDate: endDate || "",
                        selectedFlights: savedFlights || null,
                    };
                    sessionStorage.setItem(
                        "planner_request",
                        JSON.stringify(flightRequest),
                    );
                    location.href = "flight.html";
                },

                checkIncomingFlightData() {
                    const flightInfoStr = localStorage.getItem(
                        "tripPlanner_flightInfo",
                    );
                    if (flightInfoStr) {
                        const flightInfo = JSON.parse(flightInfoStr);
                        const loggedInUser = JSON.parse(
                            localStorage.getItem("loggedInUser"),
                        );
                        const draftKey =
                            loggedInUser && loggedInUser.email
                                ? `tripPlanner_draft_${loggedInUser.email}`
                                : "tripPlanner_draft_guest";
                        const draftStr = localStorage.getItem(draftKey);
                        if (draftStr)
                            Store.state = {
                                ...Store.state,
                                ...JSON.parse(draftStr),
                            };

                        if (!Store.state.currentPlanId)
                            Store.state.currentPlanId = Date.now().toString();

                        const isLocationChanged =
                            Store.state.departure !== flightInfo.departure ||
                            Store.state.destination !== flightInfo.destination;
                        const isDateChanged =
                            Store.state.startDate !== flightInfo.startDate ||
                            Store.state.endDate !== flightInfo.endDate;
                        const nextState = {
                            startDate: flightInfo.startDate,
                            endDate: flightInfo.endDate,
                            departure: flightInfo.departure,
                            destination: flightInfo.destination,
                            savedFlights: {
                                outbound: flightInfo.outbound,
                                inbound: flightInfo.inbound,
                                passengers: flightInfo.passengers, // 추가
                                totalPrice: flightInfo.totalPrice, // 추가
                            },
                        };
                        if (isLocationChanged || isDateChanged)
                            nextState.schedule = [];
                        Store.setState(nextState, false);
                        localStorage.removeItem("tripPlanner_flightInfo");
                        localStorage.setItem(
                            draftKey,
                            JSON.stringify(Store.state),
                        );
                    } else {
                        const loggedInUser = JSON.parse(
                            localStorage.getItem("loggedInUser"),
                        );
                        const draftKey =
                            loggedInUser && loggedInUser.email
                                ? `tripPlanner_draft_${loggedInUser.email}`
                                : "tripPlanner_draft_guest";
                        const draftStr = localStorage.getItem(draftKey);
                        if (draftStr)
                            Store.setState(JSON.parse(draftStr), false);
                    }
                },

                // ★ [추가됨] 미리보기 모달 제어 함수
                openPreviewModal(url) {
                    Store.setState({ showPreviewModal: true, previewUrl: url });
                },
                closePreviewModal() {
                    Store.setState({ showPreviewModal: false, previewUrl: "" });
                },

                render() {
                    const app = document.getElementById("app");
                    app.innerHTML = `
                        ${MainNavbar.render()}
                        ${Header.render()}
                        <div class="flex-1 flex overflow-hidden">
                            ${TripSetting.render()}
                            ${CenterPanel.render()}
                            ${RightPanel.render()}
                        </div>
                        <footer class="bg-muted py-8">
                            <div class="container mx-auto text-center text-muted-foreground text-sm">© 2026 여백. All rights reserved.</div>
                        </footer>
                        ${AddScheduleModal.render()}
                        ${SchedulePreviewModal.render()} 
                    `; // ★ SchedulePreviewModal 추가됨
                    this.attachEvents();
                },

                attachEvents() {
                    this.handleSearch = (query) => {
                        const term = query.toLowerCase();
                        document
                            .querySelectorAll(".place-item")
                            .forEach((item) => {
                                const text = item.dataset.text.toLowerCase();
                                item.style.display = text.includes(term)
                                    ? "block"
                                    : "none";
                            });
                    };
                    const draggables =
                        document.querySelectorAll(".draggable-source");
                    draggables.forEach((el) => {
                        el.addEventListener("dragstart", (e) => {
                            e.dataTransfer.setData(
                                "text/plain",
                                el.dataset.place,
                            );
                            e.dataTransfer.effectAllowed = "copy";
                            el.classList.add("dragging");
                        });
                        el.addEventListener("dragend", () =>
                            el.classList.remove("dragging"),
                        );
                    });
                    const dropZone = document.querySelector(".drop-zone");
                    if (dropZone) {
                        dropZone.addEventListener("dragover", (e) => {
                            e.preventDefault();
                            dropZone.classList.add("drag-over");
                        });
                        dropZone.addEventListener("dragleave", () =>
                            dropZone.classList.remove("drag-over"),
                        );
                        dropZone.addEventListener("drop", (e) => {
                            e.preventDefault();
                            dropZone.classList.remove("drag-over");
                            const rawData =
                                e.dataTransfer.getData("text/plain");
                            if (!rawData) return;
                            try {
                                const place = JSON.parse(
                                    decodeURIComponent(rawData),
                                );
                                this.addItemToSchedule(place);
                            } catch (err) {
                                console.error(err);
                            }
                        });
                    }
                },

                openAddModal() {
                    Store.setState({ showAddModal: true, editingItem: null });
                },
                closeAddModal() {
                    Store.setState({ showAddModal: false, editingItem: null });
                },
                editManualItem(itemId) {
                    const { schedule, selectedDay } = Store.state;
                    const itemToEdit = schedule[selectedDay].items.find(
                        (item) => item.id === itemId,
                    );
                    if (itemToEdit)
                        Store.setState({
                            showAddModal: true,
                            editingItem: itemToEdit,
                        });
                },
                addManualSchedule() {
                    const titleInput = document.getElementById("modal-title");
                    const memoInput = document.getElementById("modal-memo");
                    const startTimeInput =
                        document.getElementById("modal-start-time");
                    const endTimeInput =
                        document.getElementById("modal-end-time");
                    const locationInput =
                        document.getElementById("modal-location");
                    const title = titleInput ? titleInput.value.trim() : "";
                    const startTime = startTimeInput
                        ? startTimeInput.value
                        : "";
                    const endTime = endTimeInput ? endTimeInput.value : "";
                    const memo = memoInput ? memoInput.value.trim() : "";
                    const location = locationInput
                        ? locationInput.value.trim()
                        : "";

                    if (!title || !startTime || !endTime) {
                        alert("일정 제목과 시간은 필수 입력 항목입니다.");
                        return;
                    }
                    const { editingItem } = Store.state;
                    if (editingItem) {
                        const { schedule, selectedDay } = Store.state;
                        const newSchedule = [...schedule];
                        const items = newSchedule[selectedDay].items;
                        const targetIndex = items.findIndex(
                            (i) => i.id === editingItem.id,
                        );
                        if (targetIndex !== -1) {
                            items[targetIndex] = {
                                ...items[targetIndex],
                                startTime: startTime,
                                endTime: endTime,
                                memo: memo,
                                place: {
                                    ...items[targetIndex].place,
                                    name: title,
                                    country: location,
                                },
                            };
                            Store.setState({ schedule: newSchedule });
                        }
                    } else {
                        const newPlace = {
                            id: "custom-" + Date.now(),
                            name: title,
                            country: location || "",
                            image: "https://placehold.co/400x300?text=No+Image",
                            category: "custom",
                            description: memo,
                        };
                        this.addItemToSchedule(newPlace, {
                            startTime: startTime,
                            endTime: endTime,
                            memo: memo,
                        });
                    }
                    this.closeAddModal();
                },
                addItemToSchedule(place, options = {}) {
                    const { selectedDay, schedule } = Store.state;
                    if (schedule.length <= selectedDay) {
                        Store.updateScheduleDates();
                        if (Store.state.schedule.length === 0)
                            Store.state.schedule = [
                                {
                                    date: new Date()
                                        .toISOString()
                                        .split("T")[0],
                                    items: [],
                                },
                            ];
                    }
                    const newItem = {
                        id: Date.now().toString(),
                        place: place,
                        startTime: options.startTime || "10:00",
                        endTime: options.endTime || "12:00",
                        memo: options.memo || "",
                    };
                    const newSchedule = [...Store.state.schedule];
                    newSchedule[Store.state.selectedDay].items.push(newItem);
                    Store.setState({ schedule: newSchedule });
                },
                addNearbyToSchedule(placeJson) {
                    const place = JSON.parse(decodeURIComponent(placeJson));
                    if (
                        confirm(
                            `'${place.name}'을(를) 일정에 추가하시겠습니까?`,
                        )
                    ) {
                        this.addItemToSchedule(place);
                        alert(
                            "추가되었습니다. 뒤로가기를 눌러 일정을 확인하세요.",
                        );
                    }
                },
                showDetail(placeJsonOrObj) {
                    let place;
                    if (typeof placeJsonOrObj === "string")
                        place = JSON.parse(decodeURIComponent(placeJsonOrObj));
                    else place = placeJsonOrObj;
                    Store.setState({ selectedPlace: place });
                },
                closeDetail() {
                    Store.setState({ selectedPlace: null });
                },
                removeItem(itemId) {
                    if (!confirm("삭제하시겠습니까?")) return;
                    const { schedule, selectedDay } = Store.state;
                    const newSchedule = [...schedule];
                    newSchedule[selectedDay].items = newSchedule[
                        selectedDay
                    ].items.filter((i) => i.id !== itemId);
                    Store.setState({ schedule: newSchedule });
                },
                updateItem(itemId, field, value) {
                    const { schedule, selectedDay } = Store.state;
                    const newSchedule = [...schedule];
                    const item = newSchedule[selectedDay].items.find(
                        (i) => i.id === itemId,
                    );
                    if (item) {
                        item[field] = value;
                        Store.setState({ schedule: newSchedule });
                    }
                },

                // ★ [수정됨] savePlan: 저장 후 팝업 띄우도록 변경 + 항공권 정보 보존 로직 강화
                savePlan() {
                    const loggedInUser = JSON.parse(
                        localStorage.getItem("loggedInUser"),
                    );

                    if (!loggedInUser || !loggedInUser.email) {
                        alert("로그인 후 계획을 저장할 수 있습니다.");
                        window.location.href = "../auth/SignIn.html";
                        return;
                    }

                    const {
                        tripName,
                        schedule,
                        savedPlans,
                        startDate,
                        endDate,
                        departure,
                        destination,
                        savedFlights,
                    } = Store.state;

                    let currentPlanId = Store.state.currentPlanId;

                    if (!tripName || schedule.length === 0) {
                        alert("여행 제목과 일정을 입력해주세요.");
                        return;
                    }

                    if (currentPlanId) {
                        if (
                            !confirm(
                                "현재 계획을 수정하시겠습니까?\n취소를 누르면 새 계획으로 저장됩니다.",
                            )
                        ) {
                            currentPlanId = null; // 사용자가 '취소'를 누르면 새 계획으로 저장
                        }
                    }

                    let newPlans = [...savedPlans];
                    let saveId = currentPlanId;

                    if (saveId) {
                        const idx = newPlans.findIndex((p) => p.id === saveId);
                        if (idx !== -1) {
                            newPlans[idx] = {
                                ...newPlans[idx],
                                name: tripName,
                                schedule,
                                startDate,
                                endDate,
                                departure,
                                destination,
                                flightInfo:
                                    savedFlights || newPlans[idx].flightInfo,
                                updatedAt: new Date().toISOString(),
                            };
                        } else {
                            // This case should ideally not happen if state is consistent
                            saveId = Date.now().toString();
                            newPlans.push({
                                id: saveId,
                                name: tripName,
                                startDate,
                                endDate,
                                departure,
                                destination,
                                schedule,
                                flightInfo: savedFlights,
                                createdAt: new Date().toISOString(),
                            });
                        }
                    } else {
                        saveId = Date.now().toString();
                        newPlans.push({
                            id: saveId,
                            name: tripName,
                            startDate,
                            endDate,
                            departure,
                            destination,
                            schedule,
                            flightInfo: savedFlights,
                            createdAt: new Date().toISOString(),
                        });
                    }

                    const userPlansKey = `tripPlans_${loggedInUser.email}`;
                    localStorage.setItem(
                        userPlansKey,
                        JSON.stringify(newPlans),
                    );

                    Store.setState({
                        currentPlanId: saveId,
                        savedPlans: newPlans,
                    });

                    const previewUrl = `schedule.html?id=${saveId}`;
                    this.openPreviewModal(previewUrl);
                },

                loadPlan(planId) {
                    const plan = Store.state.savedPlans.find(
                        (p) => p.id === planId,
                    );
                    if (plan) {
                        Store.setState({
                            currentPlanId: plan.id,
                            tripName: plan.name,
                            startDate: plan.startDate,
                            endDate: plan.endDate,
                            departure: plan.departure || "",
                            destination: plan.destination || "",
                            schedule: plan.schedule || [],
                            savedFlights: plan.flightInfo || null, // ★ [수정됨] 불러올 때 항공권 정보 복구
                            selectedDay: 0,
                            showPlanList: false,
                        });
                    }
                },
                deletePlan(planId) {
                    const loggedInUser = JSON.parse(
                        localStorage.getItem("loggedInUser"),
                    );
                    if (!loggedInUser || !loggedInUser.email) {
                        alert("로그인 후 계획을 삭제할 수 있습니다.");
                        window.location.href = "../auth/SignIn.html";
                        return;
                    }
                    if (confirm("정말 이 계획을 삭제하시겠습니까?")) {
                        const newPlans = Store.state.savedPlans.filter(
                            (p) => p.id !== planId,
                        );
                        const userPlansKey = `tripPlans_${loggedInUser.email}`;
                        localStorage.setItem(
                            userPlansKey,
                            JSON.stringify(newPlans),
                        );
                        let nextState = { savedPlans: newPlans };
                        if (Store.state.currentPlanId === planId) {
                            const draftKey = `tripPlanner_draft_${loggedInUser.email}`;
                            localStorage.removeItem(draftKey);
                            nextState = {
                                ...nextState,
                                currentPlanId: null,
                                tripName: "새로운 여행 계획",
                                startDate: "",
                                endDate: "",
                                departure: "",
                                destination: "",
                                schedule: [],
                                selectedDay: 0,
                                showPlanList: false,
                                selectedPlace: null,
                                savedFlights: null, // 초기화 시 항공권 정보도 날림
                            };
                        }
                        Store.setState(nextState);
                    }
                },
                newPlan() {
                    const isLoggedIn = localStorage.getItem("isLoggedIn");
                    if (isLoggedIn !== "true") {
                        alert(
                            "새로운 여행 계획을 생성하려면 로그인해야 합니다.",
                        );
                        window.location.href = "../auth/SignIn.html";
                        return;
                    }
                    if (confirm("현재 작업을 초기화하시겠습니까?")) {
                        const loggedInUser = JSON.parse(
                            localStorage.getItem("loggedInUser"),
                        );
                        const draftKey =
                            loggedInUser && loggedInUser.email
                                ? `tripPlanner_draft_${loggedInUser.email}`
                                : "tripPlanner_draft_guest";
                        localStorage.removeItem(draftKey);
                        Store.setState({
                            currentPlanId: null,
                            tripName: "새로운 여행 계획",
                            startDate: "",
                            endDate: "",
                            departure: "",
                            destination: "",
                            schedule: [],
                            selectedDay: 0,
                            showPlanList: false,
                            selectedPlace: null,
                            savedFlights: null, // 초기화
                        });
                    }
                },
            };

            App.init();
        </script>
        <script src="../../js/auth.js"></script>
    </body>
</html>
