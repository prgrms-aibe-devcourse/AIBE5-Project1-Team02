<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 글</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body class="bg-background-light dark:bg-background-dark text-text-main-light dark:text-text-main-dark font-display antialiased flex flex-col min-h-screen transition-colors duration-300">
    <header class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="community-main.html" class="text-xl font-bold">커뮤니티</a>
            <a href="community-main.html" class="text-gray-500 hover:text-gray-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </a>
        </div>
    </header>
    <div class="container mx-auto px-4 py-8">
        <div id="post-container" class="max-w-4xl mx-auto bg-white dark:bg-surface-dark rounded-lg shadow-md p-8">
            <!-- Post content will be loaded here -->
            <h1 id="post-title" class="text-3xl font-bold mb-4"></h1>
            <div class="flex items-center text-sm text-gray-500 dark:text-gray-400 mb-4">
                <img id="author-img" src="" alt="Author" class="w-8 h-8 rounded-full mr-2">
                <span id="author-name"></span>
                <span class="mx-2">|</span>
                <span id="post-date"></span>
            </div>
            <img id="post-thumbnail" src="" alt="Post thumbnail" class="w-full h-auto rounded-lg mb-4">
            <div id="post-content" class="prose max-w-none dark:prose-invert">
            </div>

            <!-- Edit/Delete Buttons Container -->
            <div id="edit-delete-buttons" class="mt-8 text-right hidden">
                <button id="edit-button" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mr-2">
                    수정
                </button>
                <button id="delete-button" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                    삭제
                </button>
            </div>
        </div>
    </div>
    <footer class="bg-gray-800 text-white py-4 mt-auto">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2024 여백. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('id');

            const titleEl = document.getElementById('post-title');
            const authorImgEl = document.getElementById('author-img');
            const authorNameEl = document.getElementById('author-name');
            const postDateEl = document.getElementById('post-date');
            const postThumbnailEl = document.getElementById('post-thumbnail');
            const postContentEl = document.getElementById('post-content');
            const postContainerEl = document.getElementById('post-container');
            const editDeleteButtonsEl = document.getElementById('edit-delete-buttons');
            const editButtonEl = document.getElementById('edit-button');
            const deleteButtonEl = document.getElementById('delete-button');

            if (!postId) {
                postContainerEl.innerHTML = '<p class="text-center text-red-500">게시물을 찾을 수 없습니다. (ID가 없습니다)</p>';
                return;
            }

            const posts = JSON.parse(localStorage.getItem('communityPosts')) || [];
            const post = posts.find(p => p.id === postId);

            if (post) {
                document.title = post.title; // Update browser tab title
                titleEl.textContent = post.title;
                authorImgEl.src = `https://i.pravatar.cc/150?u=${post.authorId}`;
                authorNameEl.textContent = post.author;
                postDateEl.textContent = new Date(post.date).toLocaleDateString('ko-KR');
                postThumbnailEl.src = post.thumbnail;
                postThumbnailEl.alt = post.title;
                postContentEl.innerHTML = post.content.replace(/\n/g, '<br>');

                // Check if the current user is the author
                const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                if (currentUser && currentUser.id === post.authorId) {
                    editDeleteButtonsEl.classList.remove('hidden');
                }

                editButtonEl.addEventListener('click', function () {
                    // Save the post id to localStorage to be picked up by the main page
                    localStorage.setItem('editPostId', postId);
                    // Redirect to the main page
                    window.location.href = 'community-main.html';
                });

                deleteButtonEl.addEventListener('click', function () {
                    if (confirm('정말로 이 게시물을 삭제하시겠습니까?')) {
                        const updatedPosts = posts.filter(p => p.id !== postId);
                        localStorage.setItem('communityPosts', JSON.stringify(updatedPosts));
                        alert('게시물이 삭제되었습니다.');
                        window.location.href = 'community-main.html';
                    }
                });

            } else {
                postContainerEl.innerHTML = `<p class="text-center text-red-500">게시물 (ID: ${postId})을 찾을 수 없습니다.</p>`;
            }
        });
    </script>
</body>
</html>
