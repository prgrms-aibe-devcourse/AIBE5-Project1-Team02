              title: "예산으로 세부 여행",
              author: "마야 첸",
              authorId: "user4",
              date: "2024-07-18",
              content: "비용 부담 없는 최고의 경험.",
              thumbnail: "./community-image/세부.JPG",
              likes: 3400,
              tags: ["예산", "아시아"],
              duration: 10,
              rating: 4.7,
              continent: "아시아",
              destination: "세부",
              liked: false,
              bookmarked: false,
              routeData: [],
            },
            {
              id: "static-5",
              title: "나홀로 타이베이 여행",
              author: "데이비드 김",
              authorId: "user5",
              date: "2024-07-17",
              content: "나홀로 여행자를 위한 안전하고 매력적인 여정.",
              thumbnail: "./community-image/대만.JPG",
              likes: 920,
              tags: ["나홀로 여행", "아시아"],
              duration: 5,
              rating: 4.6,
              continent: "아시아",
              destination: "타이베이",
              liked: false,
              bookmarked: false,
              routeData: [],
            },
            {
              id: "static-6",
              title: "나고야 & 지브리파크 가족 여행",
              author: "엘레나",
              authorId: "user6",
              date: "2024-07-16",
              content: "가족과 함께하는 스트레스 없는 여행.",
              thumbnail: "./community-image/나고야성.JPG",
              likes: 2800,
              tags: ["가족", "아시아"],
              duration: 12,
              rating: 4.9,
              continent: "아시아",
              destination: "나고야",
              liked: false,
              bookmarked: false,
              routeData: [],
            },
          ];
          const savedPosts =
            JSON.parse(localStorage.getItem("communityPosts")) || [];
          const combinedPosts = [...savedPosts];
          staticPosts.forEach((staticPost) => {
            if (!combinedPosts.some((p) => p.id === staticPost.id))
              combinedPosts.push(staticPost);
          });
          allPostsData = combinedPosts;
          localStorage.setItem("communityPosts", JSON.stringify(allPostsData));
          populateTagFilters();
        }

        function populateTagFilters() {
          const allTags = [
            ...new Set(allPostsData.flatMap((p) => p.tags || [])),
          ];
          tagFilterContainer.innerHTML = "";
          allTags.forEach((tag) => {
            const label = document.createElement("label");
            label.className =
              "flex items-center gap-3 cursor-pointer group/item";
            label.innerHTML = `<input type="checkbox" name="tag" value="${tag}" class="size-4 rounded border-gray-300 text-primary focus:ring-primary dark:bg-surface-dark dark:border-gray-600"><span class="text-sm text-text-muted-light dark:text-text-muted-dark group-hover/item:text-primary transition-colors">${tag}</span>`;
            tagFilterContainer.appendChild(label);
          });
          tagFilterContainer.addEventListener("change", () => updateGallery());
        }

        function updateGallery(resetUi = true) {
          if (resetUi) isExpanded = false;
          const selectedDestinations = Array.from(
            document.querySelectorAll('input[name="destination"]:checked'),
          ).map((cb) => cb.value);
          const selectedTags = Array.from(
            document.querySelectorAll('input[name="tag"]:checked'),
          ).map((cb) => cb.value);
          let currentUser = null;
          try {
            currentUser = JSON.parse(localStorage.getItem("currentUser"));
          } catch {}

          currentFilteredPosts = allPostsData.filter((post) => {
            if (
              showOnlyMyPosts &&
              (!currentUser || post.authorId !== currentUser.id)
            )
              return false;
            const destMatch =
              selectedDestinations.length === 0 ||
              (post.tags &&
                selectedDestinations.some(destination => post.tags.includes(destination)));
            const tagMatch =
              selectedTags.length === 0 ||
              (post.tags &&
                post.tags.some((tag) => selectedTags.includes(tag)));
            return destMatch && tagMatch;
          });

          const sortBy = sortSelect.value;
          currentFilteredPosts.sort((a, b) => {
            if (sortBy === "popular") return (b.likes || 0) - (a.likes || 0);
            if (sortBy === "rating") return (b.rating || 0) - (a.rating || 0);
            return (
              (new Date(b.date).getTime() || 0) -
              (new Date(a.date).getTime() || 0)
            );
          });
          renderPlans();
        }

        function renderPlans() {
          planContainer.innerHTML = "";
          const postsToDisplay = isExpanded
            ? currentFilteredPosts
            : currentFilteredPosts.slice(0, initialVisibleCount);
          if (postsToDisplay.length === 0) {
            planContainer.innerHTML = `<div class="col-span-full text-center py-10 text-text-muted-light">${showOnlyMyPosts ? "작성한 글이 없습니다." : "조건에 맞는 여행 계획이 없습니다."}</div>`;
            loadMoreBtn.style.display = "none";
            return;
          }
          postsToDisplay.forEach((post) => {
            planContainer.appendChild(createPlanCardElement(post));
          });

          if (currentFilteredPosts.length > initialVisibleCount) {
            loadMoreBtn.style.display = "block";
            loadMoreBtn.textContent = isExpanded
              ? "간략히 보기"
              : "더 많은 계획 불러오기";
          } else {
            loadMoreBtn.style.display = "none";
          }
        }

        function createPlanCardElement(post) {
          const article = document.createElement("article");
          article.dataset.id = post.id;
          article.className =
            "plan-card group flex flex-col bg-surface-light dark:bg-surface-dark rounded-xl overflow-hidden border border-border-light dark:border-border-dark shadow-soft hover:shadow-soft-hover h-full relative";
          const likesCount =
            post.likes > 1000
              ? `${(post.likes / 1000).toFixed(1)}k`
              : post.likes;
          const isBookmarked = post.bookmarked
            ? "material-symbols-outlined text-[20px] fill-current text-primary"
            : "material-symbols-outlined text-[20px]";
          const isLiked = post.liked
            ? "material-symbols-outlined text-[20px] fill-current text-secondary"
            : "material-symbols-outlined text-[20px]";

          article.innerHTML = `
              <div class="relative h-56 overflow-hidden">
                 <div class="absolute top-3 left-3 bg-black/40 backdrop-blur-sm text-white text-xs font-bold px-3 py-1 rounded-full z-10 flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">schedule</span>${post.duration ? `${post.duration}일` : "여행 미지정"}</div>
                <button data-action="bookmark" class="absolute top-3 right-3 p-2 bg-white/10 hover:bg-white/20 backdrop-blur-md rounded-full text-white hover:text-primary transition-colors z-10"><span class="${isBookmarked}">bookmark</span></button>
                <a href="community-post.html?id=${post.id}" class="absolute inset-0"></a>
                <img alt="${post.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out" src="${post.thumbnail}" onerror="this.src = 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=400&h=300&fit=crop'" />
              </div>
              <div class="p-5 flex flex-col flex-1">
                <div class="flex justify-between items-start mb-2">
                   <div class="flex items-center gap-1 text-primary text-xs font-bold uppercase tracking-wider bg-primary/10 px-2 py-0.5 rounded-md">${post.tags && post.tags.length > 0 ? post.tags[0] : "일반"}</div>
                  <div class="flex items-center gap-1 text-accent text-sm font-bold"><span class="material-symbols-outlined text-[18px] fill-current">star</span><span>${post.rating || 0}</span></div>
                </div>
                <a href="community-post.html?id=${post.id}"><h3 class="text-lg font-bold text-text-main-light dark:text-white leading-tight mb-2 group-hover:text-primary transition-colors cursor-pointer">${post.title}</h3></a>
                <p class="text-sm text-text-muted-light dark:text-text-muted-dark line-clamp-2 mb-4">${post.content}</p>
                <div class="mt-auto flex items-center justify-between pt-4 border-t border-border-light dark:border-border-dark">
                  <div class="flex items-center gap-2">
                    <div class="size-8 rounded-full bg-gray-200 overflow-hidden"><img src="https://i.pravatar.cc/150?u=${post.authorId}" alt="User" /></div>
                    <span class="text-sm font-medium text-text-main-light dark:text-white">${post.author}</span>
                  </div>
                  <button data-action="like" class="flex items-center gap-1.5 text-text-muted-light hover:text-secondary transition-colors"><span class="${isLiked}">favorite</span><span class="text-xs font-bold">${likesCount}</span></button>
                </div>
              </div>`;
          return article;
        }

        document
          .querySelectorAll('input[name="destination"]')
          .forEach((cb) =>
            cb.addEventListener("change", () => updateGallery()),
          );
        sortSelect.addEventListener("change", () => updateGallery());
        resetBtn.addEventListener("click", () => {
          document
            .querySelectorAll('input[type="checkbox"]')
            .forEach((cb) => (cb.checked = false));
          sortSelect.value = "popular";
          showOnlyMyPosts = false;
          myPostsBtn.classList.remove("bg-primary", "text-white");
          updateGallery();
        });
        loadMoreBtn.addEventListener("click", () => {
          isExpanded = !isExpanded;
          renderPlans();
        });
        myPostsBtn.addEventListener("click", () => {
          showOnlyMyPosts = !showOnlyMyPosts;
          myPostsBtn.classList.toggle("bg-primary", showOnlyMyPosts);
          myPostsBtn.classList.toggle("text-white", showOnlyMyPosts);
          updateGallery();
        });
        planContainer.addEventListener("click", (e) => {
          const button = e.target.closest("button[data-action]");
          if (!button) return;
          const card = e.target.closest(".plan-card");
          const postId = card.dataset.id;
          const post = allPostsData.find((p) => p.id === postId);
          if (!post) return;
          if (button.dataset.action === "like") {
            post.liked = !post.liked;
            post.likes = (post.likes || 0) + (post.liked ? 1 : -1);
          } else if (button.dataset.action === "bookmark") {
            post.bookmarked = !post.bookmarked;
          }
          localStorage.setItem("communityPosts", JSON.stringify(allPostsData));
          updateGallery(false);
        });

        initializeAndLoadPosts();
        updateGallery();

        const communityWriteModal = document.getElementById(
          "community-write-modal",
        );
        const openWriteModalBtn = document.getElementById(
          "open-write-modal-button",
        );
        const closeWriteModalBtn = document.getElementById("close-write-modal");
        const submitPostBtn = document.getElementById("submit-post-button");
        const cancelPostBtn = document.getElementById("cancel-post-button");
        const postTitleInput = document.getElementById("post-title");
        const postContentTextarea = document.getElementById("post-content");
        const starRatingSlider = document.getElementById("star-rating-slider");
        const starRatingDisplay = document.getElementById(
          "star-rating-display",
        );
        const locationDisplay = document.getElementById("location-display");
        const openMapModalBtn = document.getElementById(
          "open-map-modal-button",
        );
        const tagInput = document.getElementById("tag-input");
        const addTagButton = document.getElementById("add-tag-button");
        const tagsContainer = document.getElementById("tags-container");
        const thumbnailFileInput = document.getElementById(
          "thumbnail-file-input",
        );
        const uploadButton = document.getElementById("upload-button");
        const thumbnailUrlInput = document.getElementById("thumbnail-url");

        const mapModal = document.getElementById("map-modal");
        const closeMapModalBtn = document.getElementById(
          "close-map-modal-button",
        );
        const saveLocationBtn = document.getElementById("save-location-button");
        const mapContainer = document.getElementById("map");
        const mapSearchInput = document.getElementById("map-search-input");
        const mapSearchBtn = document.getElementById("map-search-button");
        const searchResultsList = document.getElementById(
          "search-results-list",
        );
        const selectedRouteList = document.getElementById(
          "selected-route-list",
        );

        let editPostId = null,
          rating = 0;
        let routeData = [],
          tempRouteData = [];
        let map = null,
          markers = [],
          polyline = null;
        let tags = [];
        let currentTagInput = "";
        let thumbnail = "";

        function setRating(newRating) {
          // 2-1. 값 저장 및 표시
          rating = parseFloat(newRating).toFixed(1); // 소수점 1자리까지
          starRatingSlider.value = rating;
          starRatingDisplay.textContent = rating; // 숫자 업데이트

          // 2-2. 별 아이콘들 가져오기
          const starIcons = document.querySelectorAll(
            '#star-visual-display .star-icon',
          );
          const ratingValue = parseFloat(rating);

          // 2-3. 각 별마다 처리
          starIcons.forEach((star, index) => {
            // 예: rating = 3.7이면
            // index 0,1,2 → 완전히 채움
            // index 3 → 70% 채움
            // index 4 → 빈 별

            if (index < Math.floor(ratingValue)) {
              // 완전히 채워진 별 (예: 0,1,2번째 별)
              star.style.color = '#FFD700'; // 금색
            } else if (index < ratingValue) {
              // 부분적으로 채워진 별 (예: 3번째 별)
              const percentage = (ratingValue - index) * 100; // 70%
              star.style.background = `linear-gradient(90deg, #FFD700 ${percentage}%, #d1d5db ${percentage}%)`;
              star.style.webkitBackgroundClip = 'text';
              star.style.webkitTextFillColor = 'transparent';
            } else {
              // 빈 별 (예: 4번째 별)
              star.style.color = '#d1d5db'; // 회색
              star.style.background = 'none';
              star.style.webkitTextFillColor = 'inherit';
            }
          });
        }
        function setRouteData(newRoute) {
          routeData = newRoute || [];
          locationDisplay.value = routeData.length
            ? `${routeData.length}개 장소 선택됨`
            : "지도에서 경로를 추가하세요";
        }
        function setTags(newTags) {
          tags = newTags || [];
          updateTagsDisplay();
        }
        function updateTagsDisplay() {
          tagsContainer.innerHTML = "";
          tags.forEach((tag) => {
            const span = document.createElement("span");
            span.className =
              "px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full flex items-center gap-2";
            span.innerHTML = `#${tag} <button type="button" class="hover:text-indigo-900" data-tag="${tag}"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>`;
            tagsContainer.appendChild(span);
          });
        }
        function setThumbnail(newThumbnail) {
          thumbnail = newThumbnail || "";
          thumbnailUrlInput.value = thumbnail;
          document.getElementById("thumbnail-preview").src = thumbnail;
          document
            .getElementById("thumbnail-preview-container")
            .classList.toggle("hidden", !thumbnail);
        }

        openWriteModalBtn.addEventListener("click", () => {
          communityWriteModal.classList.remove("hidden");
          document.body.classList.add("overflow-hidden");
          editPostId = null;
          postTitleInput.value = "";
          postContentTextarea.value = "";
          setTags([]);
          setRating(0.0);
          setRouteData([]);
          setThumbnail("");
          document.getElementById("write-modal-title").textContent =
            "게시글 작성";
        });

        closeWriteModalBtn.addEventListener("click", () => {
          communityWriteModal.classList.add("hidden");
          document.body.classList.remove("overflow-hidden");
        });
        cancelPostBtn.addEventListener("click", () =>
          closeWriteModalBtn.click(),
        );
        starRatingSlider.addEventListener("input", (e) =>
          setRating(e.target.value),
        );
        addTagButton.addEventListener("click", () => {
          currentTagInput = tagInput.value.trim();
          if (currentTagInput && !tags.includes(currentTagInput)) {
            setTags([...tags, currentTagInput]);
            tagInput.value = "";
          }
        });
        tagInput.addEventListener("keypress", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            addTagButton.click();
          }
        });
        tagsContainer.addEventListener("click", (e) => {
          const button = e.target.closest("button");
          if (button && button.dataset.tag)
            setTags(tags.filter((tag) => tag !== button.dataset.tag));
        });
        uploadButton.addEventListener("click", () =>
          thumbnailFileInput.click(),
        );
        thumbnailFileInput.addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (e) => setThumbnail(e.target.result);
            reader.readAsDataURL(file);
          }
        });
        thumbnailUrlInput.addEventListener("input", (e) =>
          setThumbnail(e.target.value),
        );

        let ps;
        openMapModalBtn.addEventListener("click", () => {
          mapModal.classList.remove("hidden");
          try {
            if (
              typeof kakao === "undefined" ||
              typeof kakao.maps === "undefined"
            )
              throw new Error("Kakao Maps script not loaded");
            if (!map) {
              const options = {
                center: new kakao.maps.LatLng(37.566826, 126.9786567),
                level: 5,
              };
              map = new kakao.maps.Map(mapContainer, options);
              ps = new kakao.maps.services.Places();
              polyline = new kakao.maps.Polyline({
                strokeWeight: 3,
                strokeColor: "#db4040",
                strokeOpacity: 0.8,
                strokeStyle: "solid",
              });
            }
            tempRouteData = [...routeData];
            updateRouteUI();
            setTimeout(() => map && map.relayout(), 0);
          } catch (e) {
            mapContainer.innerHTML = `<div class="p-4 text-center text-red-500">지도 로딩 실패: ${e.message}. API 키를 확인해주세요.</div>`;
          }
        });
        closeMapModalBtn.addEventListener("click", () =>
          mapModal.classList.add("hidden"),
        );
        saveLocationBtn.addEventListener("click", () => {
          setRouteData(tempRouteData);
          mapModal.classList.add("hidden");
        });
        mapSearchBtn.addEventListener("click", searchPlaces);
        mapSearchInput.addEventListener(
          "keydown",
          (e) => e.key === "Enter" && searchPlaces(),
        );
        selectedRouteList.addEventListener("click", (e) => {
          if (e.target.tagName === "BUTTON")
            removePlaceFromRoute(e.target.dataset.id);
        });

        function searchPlaces() {
          if (!ps) return alert("지도 서비스가 초기화되지 않았습니다.");
          const keyword = mapSearchInput.value.trim();
          if (!keyword) return alert("키워드를 입력해주세요!");
          ps.keywordSearch(keyword, (data, status) => {
            if (status === kakao.maps.services.Status.OK)
              displaySearchResults(data);
            else alert("검색 결과가 없습니다.");
          });
        }
        function displaySearchResults(places) {
          searchResultsList.innerHTML = "";
          places.forEach((place, i) => {
            const li = document.createElement("li");
            li.innerHTML = `<div class="p-2 hover:bg-gray-100 cursor-pointer"><span class="font-semibold">${i + 1}. ${place.place_name}</span><div class="text-xs text-gray-500">${place.road_address_name || place.address_name}</div></div>`;
            li.onclick = () => addPlaceToRoute(place);
            searchResultsList.appendChild(li);
          });
        }
        function addPlaceToRoute(place) {
          if (tempRouteData.find((p) => p.id === place.id)) return;
          tempRouteData.push(place);
          updateRouteUI();
        }
        function removePlaceFromRoute(placeId) {
          tempRouteData = tempRouteData.filter((p) => p.id !== placeId);
          updateRouteUI();
        }
        function updateRouteUI() {
          selectedRouteList.innerHTML = "";
          markers.forEach((m) => m.setMap(null));
          markers = [];
          const path = [];
          if (tempRouteData.length > 0) {
            const bounds = new kakao.maps.LatLngBounds();
            tempRouteData.forEach((place, i) => {
              const li = document.createElement("li");
              li.className = "p-2 flex justify-between items-center";
              li.innerHTML = `<span>${i + 1}. ${place.place_name}</span><button data-id="${place.id}" class="text-red-500 text-xs">삭제</button>`;
              selectedRouteList.appendChild(li);

              const latlng = new kakao.maps.LatLng(place.y, place.x);
              const marker = new kakao.maps.Marker({ position: latlng });
              marker.setMap(map);
              markers.push(marker);
              path.push(latlng);
              bounds.extend(latlng);
            });
            map.setBounds(bounds);
          }
          polyline.setPath(path.length > 1 ? path : []);
          polyline.setMap(map);
        }

        submitPostBtn.addEventListener("click", () => {
          const title = postTitleInput.value;
          const content = postContentTextarea.value;
          if (!title.trim() || !content.trim())
            return alert("제목과 내용을 입력해주세요.");
          let currentUser = { name: "익명", id: "anonymous" };
          try {
            currentUser =
              JSON.parse(localStorage.getItem("currentUser")) || currentUser;
          } catch {}

          const postData = {
            title,
            content,
            tags,
            rating,
            routeData,
            thumbnail,
          };

          // 태그 중 알려진 대륙과 일치하는 것이 있으면 대륙을 추론합니다.
          const knownContinents = ["유럽", "아시아", "북미"];
          const inferredContinent = tags.find(tag => knownContinents.includes(tag));
          if (inferredContinent) {
            postData.continent = inferredContinent;
          }

          if (editPostId) {
            const index = allPostsData.findIndex((p) => p.id === editPostId);
            if (index > -1)
              allPostsData[index] = { ...allPostsData[index], ...postData };
          } else {
            allPostsData.unshift({
              ...postData,
              id: `post-${Date.now()}`,
              author: currentUser.name,
              authorId: currentUser.id,
              date: new Date().toISOString(),
              likes: 0,
              liked: false,
              bookmarked: false,
            });
          }
          localStorage.setItem("communityPosts", JSON.stringify(allPostsData));
          populateTagFilters();
          alert(
            editPostId
              ? "게시글이 수정되었습니다."
              : "게시글이 작성되었습니다.",
          );
          closeWriteModalBtn.click();
          updateGallery(true);
        });
      });
    </script>
  </body>
</html>
